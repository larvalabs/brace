# Frozen SHA-256 hashes of released framework migrations.
#
# Released framework migrations are IMMUTABLE: once a V*.sql file under
# src/main/resources/brace/db/migration{,_pg} has shipped, its bytes must never
# change. Editing one — even cosmetically — desynchronizes Flyway's recorded
# checksum (flyway_brace_history) from the file and breaks every deployment that
# already applied it on its next startup. To change behavior, add a NEW forward
# migration; never edit an old one.
#
# FrameworkMigrationsFrozenTest enforces this. If it fails:
#   - You edited a released migration  -> revert it; add a new V* instead.
#   - You added a new migration        -> add its `name=sha256` line below
#                                         (the failure message prints the line).
# This hash is the raw SHA-256 of the file bytes (stricter than Flyway's own
# checksum on purpose — whitespace counts). Regenerate with:
#   shasum -a 256 src/main/resources/brace/db/migration{,_pg}/*.sql
#
# Lines are `filename=sha256`; order is irrelevant; `#` lines are comments.

