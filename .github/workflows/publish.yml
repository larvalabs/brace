name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # Skip deploy when a release commit is pushed to main: the tag push (firing
      # against the same SHA) will handle the actual release deploy. Without this
      # guard, both runs race on the deploy and the loser gets a 409 Conflict.
      - name: Decide whether to deploy
        id: decide
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$VERSION" != *-SNAPSHOT ]]; then
            echo "Skipping deploy: release version $VERSION on main push — the tag run handles release deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will deploy version $VERSION (ref $GITHUB_REF)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Same gate as ci.yml: fails on any HIGH/CRITICAL (CVSS >= 7.0) or unrated
      # advisory against a direct or transitive dependency, so nothing is deployed
      # or released while one is open. An advisory published after the PR merged
      # is caught here; fix it (bump, or a dated ignore in osv-scanner.toml) and
      # push again. See RELEASE.md.
      - name: Dependency vulnerability scan (OSV-Scanner, fails on HIGH/CRITICAL)
        if: steps.decide.outputs.skip != 'true'
        run: .github/scripts/osv-scan.sh

      - name: Deploy (runs tests then publishes)
        if: steps.decide.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the curated release notes when the release has them; otherwise
          # fall back to GitHub's generated commit list.
          NOTES_FILE="docs/release-notes-${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          # A tag with a suffix (v0.1.11-rc.1) is a preview: publish it as a
          # prerelease so it never becomes "latest". install.sh and
          # `brace self-update` resolve the latest release, so a preview marked
          # latest would be handed to everyone. Projects opt in by pinning it.
          PRERELEASE_ARGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi
          # target/brace-*.jar already matches both the main and -sources jars;
          # listing target/brace-*-sources.jar explicitly attaches it twice and
          # GitHub's upload endpoint returns 404 on the duplicate name.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            "${PRERELEASE_ARGS[@]}" \
            "${NOTES_ARGS[@]}" \
            target/brace-*.jar \
            target/brace-*.zip
